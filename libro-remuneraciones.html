<!doctype html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro de Remuneraciones IncoSAF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --paper:#EFEEE4;
    --paper-2:#E7E5D8;
    --ink:#1C2B27;
    --ink-soft:#3E5049;
    --ledger:#1F5C4D;
    --ledger-dark:#163F35;
    --stamp:#A13D2B;
    --line:#C9C4AE;
    --white:#FBFAF5;
    --gold:#B08A3E;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--paper);}
  body{
    margin:0; color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:var(--white); }
  .app{ display:flex; min-height:100vh; }
  /* SIDEBAR */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--ledger-dark);
    color:var(--paper); display:flex; flex-direction:column;
    padding:22px 0;
  }
  .brand{ padding:0 20px 18px 20px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:10px;}
  .brand .mark{ font-family:'Source Serif 4', serif; font-weight:700; font-size:1.5rem; letter-spacing:.02em; color:var(--white);}
  .brand .sub{ font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); margin-top:4px;}
  nav{ display:flex; flex-direction:column; gap:2px; padding:10px 10px; }
  .tab-btn{
    all:unset; cursor:pointer; padding:11px 14px; border-radius:4px;
    font-size:.86rem; font-weight:500; color:rgba(255,255,255,.72);
    display:flex; align-items:center; gap:10px;
  }
  .tab-btn .num{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--gold); width:16px;}
  .tab-btn:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .tab-btn.active{ background:var(--ledger); color:#fff; box-shadow: inset 3px 0 0 var(--gold); }
  .sidebar-foot{ margin-top:auto; padding:16px 20px; font-size:.68rem; color:rgba(255,255,255,.4); border-top:1px solid rgba(255,255,255,.1);}
  /* MAIN */
  main{ flex:1; padding:20px 40px 60px; max-width:1200px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  h1{
    font-family:'Source Serif 4', serif; font-weight:600; font-size:1.7rem; margin:0;
    color:var(--ink); position:relative; padding-bottom:8px;
  }
  h1::after{ content:""; position:absolute; left:0; bottom:0; width:46px; height:3px; background:var(--stamp); }
  .empresa-picker{ display:flex; align-items:center; gap:10px; font-size:.84rem; }
  .empresa-picker select{ min-width:230px; }
  select, input, textarea{
    font-family:'IBM Plex Sans', sans-serif; font-size:.88rem;
    background:var(--white); border:1px solid var(--line); border-radius:3px;
    padding:8px 10px; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--ledger); outline-offset:1px; }
  label{ font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); display:block; margin-bottom:4px; font-weight:600;}
  .field{ margin-bottom:12px; }
  .grid{ display:grid; gap:14px; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:1fr 1fr 1fr; }
  .grid-4{ grid-template-columns:1fr 1fr 1fr 1fr; }
  .card{
    background:var(--white); border:1px solid var(--line); border-radius:6px;
    padding:22px; margin-bottom:20px; position:relative;
  }
  .card::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px; background:repeating-linear-gradient(90deg, var(--ledger) 0 8px, transparent 8px 14px); border-radius:6px 6px 0 0; opacity:.5;}
  .card h2{ font-family:'Source Serif 4',serif; font-size:1.1rem; margin:0 0 16px; color:var(--ink); font-weight:600;}
  .btn{
    all:unset; cursor:pointer; padding:9px 16px; border-radius:3px; font-size:.82rem; font-weight:600;
    background:var(--ledger); color:#fff; text-align:center; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{ background:var(--ledger-dark); }
  .btn.secondary{ background:transparent; color:var(--ledger); border:1px solid var(--ledger); }
  .btn.secondary:hover{ background:var(--ledger); color:#fff; }
  .btn.danger{ background:transparent; color:var(--stamp); border:1px solid var(--stamp); }
  .btn.danger:hover{ background:var(--stamp); color:#fff; }
  .btn.gold{ background:var(--gold); color:#fff; }
  .btn.gold:hover{ background:#8f6c2c; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .row-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  table{ width:100%; border-collapse:collapse; font-size:.84rem; }
  thead th{
    text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); border-bottom:2px solid var(--ink); padding:8px 10px; font-weight:600;
  }
  tbody td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:hover{ background:var(--paper-2); }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .num{ font-family:'IBM Plex Mono', monospace; text-align:right; display:block; }
  .pill{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:.7rem; font-weight:600; }
  .pill.on{ background:#E1EEE9; color:var(--ledger-dark); }
  .pill.off{ background:#F0DEDA; color:var(--stamp); }
  .empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty .glyph{ font-family:'Source Serif 4',serif; font-size:2.4rem; color:var(--line); margin-bottom:6px;}
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff; padding:12px 18px;
    border-radius:4px; font-size:.85rem; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:999; opacity:0; transform:translateY(8px);
    transition:.25s; max-width:360px;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  .modal-bg{ position:fixed; inset:0; background:rgba(20,30,27,.55); display:flex; align-items:center; justify-content:center; z-index:900; padding:20px;}
  .modal{ background:var(--white); border-radius:6px; padding:26px; width:100%; max-width:560px; max-height:88vh; overflow:auto; border-top:4px solid var(--gold);}
  .modal h3{ font-family:'Source Serif 4',serif; margin-top:0; }
  .close-x{ all:unset; cursor:pointer; float:right; font-size:1.2rem; color:var(--ink-soft); }
  .helptext{ font-size:.74rem; color:var(--ink-soft); margin-top:2px; }
  .totales-box{ background:var(--paper-2); border-radius:5px; padding:16px 18px; margin-top:14px; }
  .totales-box .line{ display:flex; justify-content:space-between; padding:4px 0; font-size:.86rem; }
  .totales-box .line.strong{ font-weight:700; border-top:1px solid var(--line); margin-top:6px; padding-top:10px; font-size:1rem; color:var(--ledger-dark); }
  .badge-count{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--gold); margin-left:6px;}
  .disclaimer{ font-size:.74rem; color:var(--ink-soft); background:var(--paper-2); border-left:3px solid var(--gold); padding:10px 14px; border-radius:0 4px 4px 0; margin-bottom:18px; }
  .top-tools{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  @media (max-width:860px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; overflow-x:auto; padding:12px; }
    nav{ flex-direction:row; }
    .brand{ display:none; }
    main{ padding:20px; }
  }

  /* ---- Acceso y roles (IncoSAF) ---- */
  .gate-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; }
  .gate-card{
    background:var(--white); border:1px solid var(--line); border-radius:8px;
    padding:36px 34px; width:100%; max-width:420px; border-top:5px solid var(--gold);
    box-shadow:0 18px 40px rgba(28,43,39,.14);
  }
  .gate-mark{ font-family:'Source Serif 4',serif; font-weight:700; font-size:1.7rem; color:var(--ledger-dark); text-align:center; }
  .gate-sub{ text-align:center; font-size:.72rem; text-transform:uppercase; letter-spacing:.14em; color:var(--gold); margin-top:4px; margin-bottom:26px; }
  .gate-card p{ font-size:.86rem; color:var(--ink-soft); line-height:1.5; }
  .gate-card .field{ margin-bottom:16px; }
  .gate-card input{ width:100%; text-align:center; letter-spacing:.06em; font-family:'IBM Plex Mono',monospace; font-size:1rem; }
  .gate-card .btn{ width:100%; justify-content:center; }
  .gate-error{ background:#F0DEDA; color:var(--stamp); border-radius:4px; padding:9px 12px; font-size:.8rem; margin-bottom:14px; text-align:center; }
  .gate-help{ font-size:.72rem; color:var(--ink-soft); text-align:center; margin-top:18px; line-height:1.5; }

  .top-session{ display:flex; align-items:center; justify-content:flex-end; gap:14px; margin-bottom:6px; font-size:.76rem; color:var(--ink-soft); }
  .top-session .who{ font-family:'IBM Plex Mono',monospace; color:var(--ink); }
  .top-session button{ all:unset; cursor:pointer; color:var(--stamp); font-weight:600; }
  .local-banner{ font-size:.74rem; color:var(--stamp); background:#F0DEDA; border-radius:4px; padding:8px 12px; margin-bottom:14px; }

  .role-banner{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--paper-2); border-left:3px solid var(--stamp); border-radius:0 5px 5px 0;
    padding:11px 16px; margin-bottom:18px; font-size:.82rem;
  }
  .role-banner strong{ color:var(--ledger-dark); }
  .code-chip{
    font-family:'IBM Plex Mono',monospace; background:var(--paper-2); border:1px solid var(--line);
    border-radius:4px; padding:3px 8px; font-size:.8rem; letter-spacing:.04em;
  }
  input:disabled, select:disabled, textarea:disabled{ opacity:.55; cursor:not-allowed; background:var(--paper-2); }

  /* ---- Vista de impresión ---- */
  #print-area{ display:none; }
  body.printing #root{ display:none; }
  body.printing #print-area{ display:block; }
  body.printing .toast, body.printing #modal-root{ display:none !important; }
  .print-page{ font-family:'IBM Plex Sans',sans-serif; color:#111; max-width:900px; margin:0 auto; padding:20px; }
  .print-page h1{ font-family:'Source Serif 4',serif; font-size:1.35rem; margin:0 0 2px; color:#111; }
  .print-page h1::after{ display:none; }
  .print-page .print-sub{ font-size:.82rem; color:#444; margin-bottom:18px; }
  .print-page table{ width:100%; border-collapse:collapse; font-size:.78rem; margin-top:10px; }
  .print-page th, .print-page td{ border:1px solid #999; padding:5px 7px; text-align:left; }
  .print-page thead th{ background:#eee; border-bottom:1px solid #999; color:#111; }
  .print-page .num{ text-align:right; font-family:'IBM Plex Mono',monospace; }
  .print-page .total-box{ margin-top:14px; border-top:2px solid #111; padding-top:8px; display:flex; justify-content:space-between; font-weight:700; font-size:1.05rem; }
  .print-page .firma{ display:flex; justify-content:space-between; margin-top:80px; font-size:.8rem; }
  .print-page .firma div{ width:220px; border-top:1px solid #111; text-align:center; padding-top:4px; }
  .print-toolbar{ margin-bottom:16px; }
  @media print{
    .print-toolbar{ display:none; }
    @page{ margin:14mm; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="print-area"></div>
<div id="toast" class="toast"></div>
<div id="modal-root"></div>
<script type="application/json" id="app-data">{}</script>
<script id="app-logic">
/* ============================================================
   Libro de Remuneraciones IncoSAF
   Plataforma compartida: cada estudiante entra con su propio
   código y lleva su propio libro de remuneraciones; el profesor
   entra con su código y puede revisar (solo lectura) el trabajo
   de cualquier estudiante. Los datos se guardan en la plataforma
   compartida (capacidad "artifact"); si esa capacidad no está
   disponible, se guarda solo en este navegador como respaldo.
   ============================================================ */

/* ---- Captura de bloques estáticos (para poder republicar la
   página completa sin retipear su propio código cada vez) ---- */
var STATIC_STYLE_HTML = document.getElementById('app-style').outerHTML;
var STATIC_LOGIC_HTML = document.getElementById('app-logic').outerHTML;
var STATIC_HEAD_FONTS =
  '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
  '<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">';

var LOCAL_KEY = 'incosaf_localdata_v1';
var SESSION_KEY = 'incosaf_session_v1';
var UI_KEY = 'incosaf_ui_v1';
var MAX_EMPRESAS = 30;

/* ---- Utilidades ---- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){ n = Math.round(n||0); return '$' + n.toLocaleString('es-CL'); }
function currentPeriodo(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }

function defaultParametros(){
  return {
    uf: 39000,
    utm: 68000,
    sueldoMinimo: 529000,
    topeImponibleUF: 87.8,
    afp: {
      'Capital': 11.44, 'Cuprum': 11.44, 'Habitat': 11.27, 'Modelo': 10.58,
      'Planvital': 11.10, 'ProVida': 11.45, 'Uno': 10.49
    },
    cesantiaTrabajadorIndef: 0.6,
    cesantiaEmpleadorIndef: 2.4,
    cesantiaEmpleadorPlazoFijo: 3.0,
    saludPct: 7,
    gratTope475: true,
    asigFamiliar: [
      {hasta: 620251, monto: 22050},
      {hasta: 905941, monto: 13530},
      {hasta: 1412957, monto: 4277},
      {hasta: Infinity, monto: 0},
    ]
  };
}

function tablaImpuestoUnico(baseUTM){
  var tramos = [
    [0, 13.5, 0, 0],
    [13.5, 30, 0.04, 0.54],
    [30, 50, 0.08, 1.74],
    [50, 70, 0.135, 4.49],
    [70, 90, 0.23, 11.14],
    [90, 120, 0.304, 17.80],
    [120, 150, 0.35, 23.32],
    [150, 310, 0.40, 30.32],
    [310, 800, 0.435, 41.17],
    [800, Infinity, 0.45, 53.17],
  ];
  for(var k=0;k<tramos.length;k++){
    var desde=tramos[k][0], hasta=tramos[k][1], factor=tramos[k][2], rebaja=tramos[k][3];
    if(baseUTM > desde && baseUTM <= hasta){
      return Math.max(0, (baseUTM*factor - rebaja));
    }
  }
  return 0;
}

function montoAsigFamiliar(renta, cargas, params){
  if(!cargas) return 0;
  var tramo = params.asigFamiliar.find(function(t){ return renta <= t.hasta; }) || params.asigFamiliar[params.asigFamiliar.length-1];
  return tramo.monto * cargas;
}

function calcularLiquidacion(trabajador, mov, params){
  var dias = mov.diasTrabajados != null ? mov.diasTrabajados : 30;
  var sueldoBase = trabajador.sueldoBase || 0;
  var sueldoProp = Math.round(sueldoBase * (dias/30));
  var valorHora = sueldoBase / 30 / 8;
  var horasExtra = mov.horasExtras || 0;
  var pagoHorasExtra = Math.round(valorHora * 1.5 * horasExtra);
  var bonosImponibles = mov.bonosImponibles || 0;

  var gratificacion = 0;
  var baseGrat = sueldoProp + pagoHorasExtra + bonosImponibles;
  if(trabajador.gratificacionLegal !== false){
    gratificacion = Math.round(baseGrat * 0.25);
    if(params.gratTope475){
      var topeMensual = Math.round((4.75 * params.sueldoMinimo) / 12);
      gratificacion = Math.min(gratificacion, topeMensual);
    }
  }

  var totalImponible = sueldoProp + pagoHorasExtra + bonosImponibles + gratificacion;
  var topeImponiblePesos = params.topeImponibleUF * params.uf;
  var imponibleAfectoAFP = Math.min(totalImponible, topeImponiblePesos);

  var tasaAFP = params.afp[trabajador.afp] != null ? params.afp[trabajador.afp] : 11.44;
  var descAFP = Math.round(imponibleAfectoAFP * (tasaAFP/100));

  var descSalud;
  if(trabajador.salud === 'isapre'){
    var legal = Math.round(imponibleAfectoAFP * (params.saludPct/100));
    descSalud = Math.max(legal, Math.round(trabajador.montoIsapre || 0));
  } else {
    descSalud = Math.round(imponibleAfectoAFP * (params.saludPct/100));
  }

  var descCesantia = 0;
  if(trabajador.tipoContrato === 'indefinido'){
    descCesantia = Math.round(imponibleAfectoAFP * (params.cesantiaTrabajadorIndef/100));
  }

  var baseTributable = totalImponible - descAFP - descSalud - descCesantia;
  var baseUTM = baseTributable / params.utm;
  var impuestoUTM = tablaImpuestoUnico(baseUTM);
  var impuestoUnico = Math.round(impuestoUTM * params.utm);

  var colacion = mov.colacion || 0;
  var movilizacion = mov.movilizacion || 0;
  var otrosNoImponibles = mov.otrosNoImponibles || 0;
  var totalNoImponible = colacion + movilizacion + otrosNoImponibles;

  var asigFamiliar = montoAsigFamiliar(totalImponible, trabajador.cargasFamiliares || 0, params);

  var anticipos = mov.anticipos || 0;
  var otrosDescuentos = mov.otrosDescuentos || 0;

  var totalHaberes = totalImponible + totalNoImponible + asigFamiliar;
  var totalDescuentos = descAFP + descSalud + descCesantia + impuestoUnico + anticipos + otrosDescuentos;
  var liquidoAPagar = totalHaberes - totalDescuentos;

  return {
    dias: dias, sueldoProp: sueldoProp, pagoHorasExtra: pagoHorasExtra, horasExtra: horasExtra,
    bonosImponibles: bonosImponibles, gratificacion: gratificacion,
    totalImponible: totalImponible, descAFP: descAFP, tasaAFP: tasaAFP, descSalud: descSalud,
    descCesantia: descCesantia, baseTributable: baseTributable,
    impuestoUnico: impuestoUnico, colacion: colacion, movilizacion: movilizacion,
    otrosNoImponibles: otrosNoImponibles, totalNoImponible: totalNoImponible,
    asigFamiliar: asigFamiliar, anticipos: anticipos, otrosDescuentos: otrosDescuentos,
    totalHaberes: totalHaberes, totalDescuentos: totalDescuentos, liquidoAPagar: liquidoAPagar
  };
}

function genCodigoEstudiante(){
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code;
  do{
    var s = '';
    for(var i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
    code = 'INC-' + s;
  } while(appData.estudiantes.some(function(e){ return e.codigo===code; }) || code.toLowerCase()===(appData.profesorCodigo||'').toLowerCase());
  return code;
}

/* ---- Estado compartido (persistido) ---- */
var appData = loadAppData();
function loadAppData(){
  var el = document.getElementById('app-data');
  var data = null;
  if(el && el.textContent && el.textContent.trim()){
    try{ data = JSON.parse(el.textContent); }catch(e){ data = null; }
  }
  if(!data || typeof data !== 'object' || !Array.isArray(data.estudiantes)){
    try{
      var local = localStorage.getItem(LOCAL_KEY);
      if(local){ var ld = JSON.parse(local); if(ld && Array.isArray(ld.estudiantes)) data = ld; }
    }catch(e){}
  }
  if(!data || typeof data !== 'object' || !Array.isArray(data.estudiantes)){
    data = { v:1, profesorCodigo:null, estudiantes:[] };
  }
  return data;
}

function getEstudiante(id){ return appData.estudiantes.find(function(e){ return e.id===id; }) || null; }

/* ---- Sesión y preferencias de navegación (solo en este navegador) ---- */
var session = loadSession();
var ui = loadUi();
function loadSession(){
  try{ var s = JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); if(s && s.role) return s; }catch(e){}
  return { role:null, estudianteId:null, viewingId:null };
}
function saveSession(){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){} }
function loadUi(){
  try{ var u = JSON.parse(localStorage.getItem(UI_KEY)||'null'); if(u) return u; }catch(e){}
  return { tab:'empresas', empresaId:null, periodo: currentPeriodo() };
}
function saveUi(){ try{ localStorage.setItem(UI_KEY, JSON.stringify(ui)); }catch(e){} }

function activeEstudiante(){
  if(session.role==='estudiante') return getEstudiante(session.estudianteId);
  if(session.role==='profesor' && session.viewingId) return getEstudiante(session.viewingId);
  return null;
}
function isReadOnly(){ return session.role==='profesor' && !!session.viewingId; }

/* ---- Persistencia (capacidad "artifact") ---- */
var artifactApi; // undefined = por resolver, null = no disponible, objeto = disponible
var canWrite = true;
var artifactApiPromise = (function(){
  return Promise.resolve().then(function(){
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        return window.claude.use('artifact').then(function(api){ artifactApi = api; return api; });
      }
    }catch(e){}
    artifactApi = null;
    return null;
  }).catch(function(){ artifactApi = null; return null; });
})();

function buildFullHtml(data){
  var dataJson = JSON.stringify(data).replace(/</g, '\\u003C');
  return '<!doctype html>\n<html lang="es-CL">\n<head>\n'
    + '<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
    + '<title>Libro de Remuneraciones IncoSAF</title>\n'

function handlePublishError(err){
  var code = err && err.code;
  if(code==='conflict'){
    toast('Otro cambio se guardó justo ahora; actualizando con la versión más reciente…');
  } else if(code==='not_writer' || code==='not_granted' || code==='capability_disabled' || code==='not_declared'){
    canWrite = false;
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(appData)); }catch(e){}
    toast('No tienes permiso de edición en esta plataforma compartida. Se guardó una copia temporal solo en este navegador — pide a tu profesor que comparta el enlace con permiso de editor.');
  } else if(code==='too_large'){
    toast('Los datos son demasiado grandes para guardar. Elimina información antigua e inténtalo de nuevo.');
  } else {
    toast('No se pudo guardar' + (err && err.message ? (': ' + err.message) : '') + '. Vuelve a intentarlo.');
  }
}

async function guardar(msgExito){
  if(artifactApi === undefined){ await artifactApiPromise; }
  if(artifactApi && canWrite){
    try{
      await artifactApi.publish(buildFullHtml(appData));
      return true; // la vista se recargará sola con los datos ya guardados
    }catch(err){
      handlePublishError(err);
      render();
      return false;
    }
  } else {
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(appData)); }catch(e){}
    if(msgExito) toast(msgExito + (artifactApi===null ? ' (guardado solo en este navegador; sin conexión a la plataforma compartida)' : ''));
    render();
    return true;
  }
}

/* ---- Utilidades de interfaz ---- */
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, 3200);
}

function openModal(title, bodyHtml, onSave, saveLabel){
  var root = document.getElementById('modal-root');
  root.innerHTML =
    '<div class="modal-bg" id="modal-bg"><div class="modal">' +
    '<button class="close-x" id="modal-close">✕</button>' +
    '<h3>' + title + '</h3>' +
    '<div id="modal-body">' + bodyHtml + '</div>' +
    '<div style="margin-top:18px; display:flex; gap:10px; justify-content:flex-end;">' +
    '<button class="btn secondary" id="modal-cancel">Cancelar</button>' +
    '<button class="btn gold" id="modal-save">' + (saveLabel||'Guardar') + '</button>' +
    '</div></div></div>';
  var close = function(){ root.innerHTML=''; };
  document.getElementById('modal-close').onclick = close;
  document.getElementById('modal-cancel').onclick = close;
  document.getElementById('modal-bg').onclick = function(ev){ if(ev.target.id==='modal-bg') close(); };
  document.getElementById('modal-save').onclick = async function(){
    var btn = document.getElementById('modal-save');
    btn.disabled = true;
    var ok = await onSave();
    if(ok!==false) close();
    else if(btn) btn.disabled = false;
  };
}

function renderLogin(){
  var root = document.getElementById('root');
  root.innerHTML =
    '<div class="gate-screen"><div class="gate-card">' +
    '<div class="gate-mark">IncoSAF</div>' +
    '<div class="gate-sub">Libro de Remuneraciones</div>' +
    '<div class="field"><label>Código de acceso</label><input id="login-code" placeholder="Tu código de estudiante o de profesor" autocomplete="off"></div>' +
    '<div id="login-error"></div>' +
    '<button class="btn gold" id="login-submit">Entrar</button>' +
    '<div class="gate-help">Cada estudiante tiene su propio código para llevar su libro de remuneraciones. El profesor usa su código para revisar el trabajo de todos.</div>' +
    '</div></div>';
  var submit = function(){
    var code = document.getElementById('login-code').value.trim();
    var errEl = document.getElementById('login-error');
    if(!code){ errEl.innerHTML = '<div class="gate-error">Ingresa un código.</div>'; return; }
    if(code.toLowerCase() === (appData.profesorCodigo||'').toLowerCase()){
      session = { role:'profesor', estudianteId:null, viewingId:null };
      saveSession(); ui.tab='estudiantes'; saveUi(); render(); return;
    }
    var est = appData.estudiantes.find(function(e){ return e.codigo && e.codigo.toLowerCase()===code.toLowerCase(); });
    if(est){
      session = { role:'estudiante', estudianteId: est.id, viewingId:null };
      saveSession(); ui.tab='empresas'; saveUi(); render(); return;
    }
    errEl.innerHTML = '<div class="gate-error">Código no válido. Verifica con tu profesor.</div>';
  };
  document.getElementById('login-submit').onclick = submit;
  document.getElementById('login-code').addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
}

function renderApp(){
  document.body.classList.remove('printing');
  var root = document.getElementById('root');
  root.innerHTML =
    '<div class="app"><aside class="sidebar">' +
    '<div class="brand"><div class="mark">IncoSAF</div><div class="sub">Libro de Remuneraciones</div></div>' +
    '<nav id="nav"></nav>' +

    '</aside><main id="main"></main></div>';

  var nav = document.getElementById('nav');
  var tabs = tabsFor();
  tabs.forEach(function(t, i){
    var b = document.createElement('button');
    b.className = 'tab-btn' + (ui.tab===t.id ? ' active':'');
    b.innerHTML = '<span class="num">' + String(i+1).padStart(2,'0') + '</span> ' + t.label;
    b.onclick = function(){ ui.tab = t.id; saveUi(); render(); };

  });

  var main = document.getElementById('main');
  var who = session.role==='profesor' ? 'Profesor' : ((getEstudiante(session.estudianteId)||{}).nombre || 'Estudiante') + ' · Estudiante';
  var top = '<div class="top-session"><span class="who">' + who + '</span><button id="btn-logout">Cerrar sesión</button></div>';
  var localBanner = artifactApi===null ? '<div class="local-banner">Esta vista no está conectada a la plataforma compartida: los cambios solo se guardan en este navegador.</div>' : '';
  var banner = '';
  if(isReadOnly()){
    var e = getEstudiante(session.viewingId);
    banner = '<div class="role-banner"><span>Modo profesor — revisando el trabajo de <strong>' + (e?e.nombre:'—') + '</strong> (solo lectura)</span><button class="btn secondary" data-act="volver-lista">Volver al listado</button></div>';
  }

  main.innerHTML = top + localBanner + banner + renderTabContent();
  document.getElementById('btn-logout').onclick = function(){
    session = { role:null, estudianteId:null, viewingId:null }; saveSession(); render();
  };
  bindEmpresaPicker();
  bindTabEvents();
  if(session.role==='profesor' && !session.viewingId && ui.tab==='estudiantes'){ /* nothing extra */ }
  if(ui.tab==='liquidaciones' && activeEstudiante()){
    refreshMovView();
  }
}

function renderTabContent(){
  if(session.role==='profesor' && !session.viewingId){
    if(ui.tab==='configuracion') return viewConfiguracionProfesor();
    return viewEstudiantesRoster();
  }
  var AE = activeEstudiante();
  if(!AE) return '<div class="card"><div class="empty">No se encontró la información de este estudiante.</div></div>';
  if(!ui.empresaId && AE.empresas.length){ ui.empresaId = AE.empresas[0].id; saveUi(); }
  if(ui.tab==='empresas') return viewEmpresas(AE);
  if(ui.tab==='trabajadores') return viewTrabajadores(AE);
  if(ui.tab==='liquidaciones') return viewLiquidaciones(AE);
  if(ui.tab==='libro') return viewLibro(AE);
  if(ui.tab==='parametros') return viewParametros(AE);
  return '';
}

  if(!AE.empresas.length){
    return '<div class="page-head"><h1>Liquidaciones</h1></div><div class="card"><div class="empty"><div class="glyph">§</div>Primero crea una empresa.</div></div>';
  }
  return '<div class="page-head"><h1>Liquidaciones de sueldo</h1><div class="top-tools">' + empresaSelector(AE) + periodoSelector() + '</div></div>' +
    '<div class="disclaimer">Verifica en Parámetros los valores de UF, UTM, sueldo mínimo y tasas AFP vigentes para el período antes de generar liquidaciones.</div>' +
    '<div class="card" id="mov-card"><h2>Haberes y descuentos variables del período</h2></div>';
}

var movCache = {};
function ensureMovLoaded(AE){
  var periodoEl = document.getElementById('periodoPicker');
  ui.periodo = periodoEl ? periodoEl.value : ui.periodo;
  saveUi();
  var key = ui.empresaId + '::' + ui.periodo;
  movCache = Object.assign({}, AE.movimientos[key] || {});
}

function renderMovTable(AE, list){
  var RO = isReadOnly();
  var rows = list.map(function(t){
    var m = movCache[t.id] || {};
    return '<tr data-tid="' + t.id + '">' +
      '<td><strong>' + t.nombres + ' ' + t.apellidos + '</strong><div class="helptext mono">' + (t.rut||'') + '</div></td>' +
      '<td><input type="number" class="mov-field" data-f="diasTrabajados" value="' + (m.diasTrabajados!=null?m.diasTrabajados:30) + '" style="width:64px;" ' + (RO?'disabled':'') + '></td>' +
      '<td><input type="number" class="mov-field" data-f="horasExtras" value="' + (m.horasExtras||0) + '" style="width:64px;" ' + (RO?'disabled':'') + '></td>' +
      '<td><input type="number" class="mov-field" data-f="bonosImponibles" value="' + (m.bonosImponibles||0) + '" style="width:90px;" ' + (RO?'disabled':'') + '></td>' +
      '<td><input type="number" class="mov-field" data-f="colacion" value="' + (m.colacion||0) + '" style="width:90px;" ' + (RO?'disabled':'') + '></td>' +
      '<td><input type="number" class="mov-field" data-f="movilizacion" value="' + (m.movilizacion||0) + '" style="width:90px;" ' + (RO?'disabled':'') + '></td>' +
      '<td><input type="number" class="mov-field" data-f="anticipos" value="' + (m.anticipos||0) + '" style="width:90px;" ' + (RO?'disabled':'') + '></td>' +
      '<td><input type="number" class="mov-field" data-f="otrosDescuentos" value="' + (m.otrosDescuentos||0) + '" style="width:90px;" ' + (RO?'disabled':'') + '></td>' +
      '<td class="row-actions"><button class="btn secondary" data-act="calc-liq" data-id="' + t.id + '">Ver</button><button class="btn gold" data-act="print-liq" data-id="' + t.id + '">Imprimir</button></td>' +
      '</tr>';
  }).join('');
  return '<div style="overflow-x:auto;"><table><thead><tr>' +
    '<th>Trabajador</th><th>Días trab.</th><th>Hrs. extra</th><th>Bonos imp.</th><th>Colación</th><th>Movilización</th><th>Anticipos</th><th>Otros desc.</th><th></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    (RO ? '' : '<div style="margin-top:16px;"><button class="btn secondary" id="save-mov">Guardar movimientos del período</button></div>') +
    '<div id="liq-detail"></div>';
}

function refreshMovView(){
  var AE = activeEstudiante();
  if(!AE || !ui.empresaId) return;
  ensureMovLoaded(AE);
  var card = document.getElementById('mov-card');
  if(!card) return;
  var list = trabajadoresDeEmpresa(AE).filter(function(t){ return t.activo!==false; });
  var html = list.length ? renderMovTable(AE, list) : '<div class="empty">No hay trabajadores activos en esta empresa.</div>';
  Array.prototype.slice.call(card.querySelectorAll(':scope > *:not(h2)')).forEach(function(n){ n.remove(); });
  var wrap = document.createElement('div'); wrap.innerHTML = html;
  Array.prototype.slice.call(wrap.childNodes).forEach(function(n){ card.appendChild(n); });
  bindMovEvents();
}

function collectMovFromDOM(){
  var rows = document.querySelectorAll('tr[data-tid]');
  rows.forEach(function(r){
    var tid = r.dataset.tid;
    var obj = movCache[tid] || {};
    r.querySelectorAll('.mov-field').forEach(function(inp){ obj[inp.dataset.f] = Number(inp.value)||0; });
    movCache[tid] = obj;
  });
}

function bindMovEvents(){
  var periodoEl = document.getElementById('periodoPicker');
  if(periodoEl) periodoEl.onchange = refreshMovView;
  var saveMovEl = document.getElementById('save-mov');
  if(saveMovEl) saveMovEl.onclick = async function(){
    collectMovFromDOM();
    var AE = activeEstudiante();
    var key = ui.empresaId + '::' + ui.periodo;
    AE.movimientos[key] = movCache;
    await guardar('Movimientos del período ' + ui.periodo + ' guardados correctamente');
  };
  document.querySelectorAll('[data-act="calc-liq"]').forEach(function(b){
    b.onclick = function(){ collectMovFromDOM(); showLiqDetail(b.dataset.id); };
  });
  document.querySelectorAll('[data-act="print-liq"]').forEach(function(b){
    b.onclick = function(){ collectMovFromDOM(); imprimirLiquidacion(b.dataset.id); };
  });
}

    '<div class="line"><span>Colación / Movilización / Otros</span><span class="num">' + fmt(l.totalNoImponible) + '</span></div>' +
    '<div class="line"><span>Asignación familiar</span><span class="num">' + fmt(l.asigFamiliar) + '</span></div>' +
    '</div><div>' +
    '<div class="line"><span>AFP ' + t.afp + ' (' + l.tasaAFP + '%)</span><span class="num">−' + fmt(l.descAFP) + '</span></div>' +
    '<div class="line"><span>Salud (' + (t.salud==='isapre'?'Isapre':'Fonasa') + ')</span><span class="num">−' + fmt(l.descSalud) + '</span></div>' +
    '<div class="line"><span>Seguro cesantía</span><span class="num">−' + fmt(l.descCesantia) + '</span></div>' +

/* ---- Impresión (usa el diálogo de impresión del navegador; "Guardar como PDF"
   funciona como destino en Chrome, Edge, Safari y Firefox sin depender de
   ninguna librería externa). ---- */
function startPrint(html){
  document.getElementById('print-area').innerHTML =
    '<div class="print-toolbar"><button class="btn gold" id="print-now">Imprimir / Guardar como PDF</button> <button class="btn secondary" id="print-cancel">Volver</button></div>' + html;
  document.body.classList.add('printing');
  document.getElementById('print-now').onclick = function(){ window.print(); };
  document.getElementById('print-cancel').onclick = function(){ document.body.classList.remove('printing'); render(); };
}
window.addEventListener('afterprint', function(){ /* deja la vista de impresión visible para reintentar o volver */ });

/* ---- Vista: Libro de Remuneraciones ---- */
function viewLibro(AE){
  if(!AE.empresas.length){
    return '<div class="page-head"><h1>Libro de Remuneraciones</h1></div><div class="card"><div class="empty"><div class="glyph">§</div>Primero crea una empresa.</div></div>';
  }
  return '<div class="page-head"><h1>Libro de Remuneraciones</h1><div class="top-tools">' + empresaSelector(AE) + periodoSelector() +
    '<button class="btn gold" id="gen-libro">Calcular y ver libro</button></div></div>' +
    '<div class="disclaimer">El libro consolida, para el período seleccionado, la liquidación de todos los trabajadores activos de la empresa (Art. 62 Código del Trabajo).</div>' +
    '<div class="card" id="libro-preview"><div class="empty">Selecciona el período y presiona «Calcular y ver libro» para generar la nómina.</div></div>';
}

function calcularFilasLibro(AE){
  var key = ui.empresaId + '::' + ui.periodo;
  var mov = AE.movimientos[key] || {};
  var list = trabajadoresDeEmpresa(AE).filter(function(t){ return t.activo!==false; });
  return list.map(function(t){ return { t: t, l: calcularLiquidacion(t, mov[t.id] || {}, AE.parametros) }; });
}

function generarLibro(){
  var AE = activeEstudiante();
  var empresa = AE.empresas.find(function(x){ return x.id===ui.empresaId; });
  var periodoEl = document.getElementById('periodoPicker');
  if(periodoEl){ ui.periodo = periodoEl.value; saveUi(); }
  var filas = calcularFilasLibro(AE);
  var prev = document.getElementById('libro-preview');
  if(!filas.length){ toast('No hay trabajadores activos'); return; }
  var rows = filas.map(function(f){
    var t=f.t, l=f.l;
    return '<tr><td>' + t.nombres + ' ' + t.apellidos + '</td><td class="mono">' + (t.rut||'') + '</td>' +
      '<td class="num">' + l.dias + '</td><td class="num">' + fmt(l.totalImponible) + '</td>' +
      '<td class="num">' + fmt(l.descAFP) + '</td><td class="num">' + fmt(l.descSalud) + '</td>' +
      '<td class="num">' + fmt(l.impuestoUnico) + '</td><td class="num">' + fmt(l.totalDescuentos) + '</td>' +
      '<td class="num"><strong>' + fmt(l.liquidoAPagar) + '</strong></td></tr>';
  }).join('');
  var totales = filas.reduce(function(acc, f){
    acc.imponible+=f.l.totalImponible; acc.afp+=f.l.descAFP; acc.salud+=f.l.descSalud;
    acc.impuesto+=f.l.impuestoUnico; acc.desc+=f.l.totalDescuentos; acc.liquido+=f.l.liquidoAPagar;
    return acc;
  }, {imponible:0,afp:0,salud:0,impuesto:0,desc:0,liquido:0});
  prev.innerHTML = '<h2>' + empresa.razonSocial + ' — Período ' + ui.periodo + '</h2>' +
    '<div style="overflow-x:auto;"><table><thead><tr><th>Trabajador</th><th>RUT</th><th>Días</th><th>Imponible</th><th>AFP</th><th>Salud</th><th>Impuesto</th><th>Tot. Desc.</th><th>Líquido</th></tr></thead>' +
    '<tbody>' + rows + '</tbody><tfoot><tr style="font-weight:700; border-top:2px solid var(--ink);"><td colspan="3">TOTALES</td>' +
    '<td class="num">' + fmt(totales.imponible) + '</td><td class="num">' + fmt(totales.afp) + '</td><td class="num">' + fmt(totales.salud) + '</td>' +
    '<td class="num">' + fmt(totales.impuesto) + '</td><td class="num">' + fmt(totales.desc) + '</td><td class="num">' + fmt(totales.liquido) + '</td></tr></tfoot></table></div>' +
    '<div style="margin-top:16px;"><button class="btn gold" id="print-libro">Imprimir / Guardar como PDF</button></div>';
  document.getElementById('print-libro').onclick = function(){ imprimirLibro(); };
}

function imprimirLibro(){
  var AE = activeEstudiante();
  var empresa = AE.empresas.find(function(x){ return x.id===ui.empresaId; });
  var filas = calcularFilasLibro(AE);
  if(!filas.length){ toast('No hay trabajadores activos'); return; }
  var rows = filas.map(function(f){
    var t=f.t, l=f.l;
    return '<tr><td>' + t.nombres + ' ' + t.apellidos + '</td><td>' + (t.rut||'') + '</td><td class="num">' + l.dias + '</td>' +
      '<td class="num">' + fmt(l.sueldoProp) + '</td><td class="num">' + fmt(l.gratificacion) + '</td>' +
      '<td class="num">' + fmt(l.totalImponible) + '</td><td class="num">' + fmt(l.descAFP) + '</td>' +
      '<td class="num">' + fmt(l.descSalud) + '</td><td class="num">' + fmt(l.descCesantia) + '</td>' +
      '<td class="num">' + fmt(l.impuestoUnico) + '</td><td class="num">' + fmt(l.totalDescuentos) + '</td>' +
      '<td class="num">' + fmt(l.totalNoImponible+l.asigFamiliar) + '</td><td class="num"><strong>' + fmt(l.liquidoAPagar) + '</strong></td></tr>';
  }).join('');
  var totales = filas.reduce(function(acc, f){
    acc.sueldo+=f.l.sueldoProp; acc.grat+=f.l.gratificacion; acc.imponible+=f.l.totalImponible;
    acc.afp+=f.l.descAFP; acc.salud+=f.l.descSalud; acc.cesantia+=f.l.descCesantia; acc.impuesto+=f.l.impuestoUnico;
    acc.desc+=f.l.totalDescuentos; acc.noimp+=(f.l.totalNoImponible+f.l.asigFamiliar); acc.liquido+=f.l.liquidoAPagar;
    return acc;
  }, {sueldo:0,grat:0,imponible:0,afp:0,salud:0,cesantia:0,impuesto:0,desc:0,noimp:0,liquido:0});
  var html = '<div class="print-page" style="max-width:100%;">' +
    '<h1>LIBRO DE REMUNERACIONES</h1>' +
    '<div class="print-sub">' + empresa.razonSocial + ' · RUT ' + (empresa.rut||'—') + ' · Período ' + ui.periodo + '</div>' +
    '<table><thead><tr><th>Trabajador</th><th>RUT</th><th>Días</th><th>Sueldo base</th><th>Gratif.</th><th>Imponible</th><th>AFP</th><th>Salud</th><th>Cesantía</th><th>Impuesto</th><th>Tot. Desc.</th><th>No imp. + Asig.</th><th>Líquido</th></tr></thead>' +
    '<tbody>' + rows + '</tbody><tfoot><tr style="font-weight:700; background:#eee;"><td colspan="3">TOTALES</td>' +
    '<td class="num">' + fmt(totales.sueldo) + '</td><td class="num">' + fmt(totales.grat) + '</td><td class="num">' + fmt(totales.imponible) + '</td>' +
    '<td class="num">' + fmt(totales.afp) + '</td><td class="num">' + fmt(totales.salud) + '</td><td class="num">' + fmt(totales.cesantia) + '</td>' +
    '<td class="num">' + fmt(totales.impuesto) + '</td><td class="num">' + fmt(totales.desc) + '</td><td class="num">' + fmt(totales.noimp) + '</td>' +
    '<td class="num">' + fmt(totales.liquido) + '</td></tr></tfoot></table>' +
    '<p style="font-size:.72rem; color:#555; margin-top:14px;">Generado el ' + new Date().toLocaleDateString('es-CL') + '. Consejo: en el diálogo de impresión elige orientación «Horizontal» para que quepan todas las columnas.</p>' +
    '</div>';
  startPrint(html);
}

/* ---- Vista: Parámetros legales ---- */

  var RO = isReadOnly();
  var p = AE.parametros;
  var afpRows = Object.keys(p.afp).map(function(name){
    return '<div class="field"><label>' + name + '</label><input type="number" step="0.01" class="afp-tasa" data-afp="' + name + '" value="' + p.afp[name] + '" ' + (RO?'disabled':'') + '></div>';
  }).join('');
  var asigRows = p.asigFamiliar.map(function(t, i){
    return '<div class="grid grid-2" style="margin-bottom:8px;">' +
      '<div class="field" style="margin-bottom:0;"><label>Tramo ' + (i+1) + ' — renta hasta $</label><input type="number" class="asig-hasta" data-i="' + i + '" value="' + (t.hasta===Infinity?'':t.hasta) + '" placeholder="' + (t.hasta===Infinity?'sin tope':'') + '" ' + (RO?'disabled':'') + '></div>' +
      '<div class="field" style="margin-bottom:0;"><label>Monto asignación</label><input type="number" class="asig-monto" data-i="' + i + '" value="' + t.monto + '" ' + (RO?'disabled':'') + '></div></div>';
  }).join('');
  return '<div class="page-head"><h1>Parámetros legales</h1></div>' +
    '<div class="disclaimer">Estos valores son referenciales y deben actualizarse periódicamente según UF, UTM, sueldo mínimo, tasas AFP y tramos de asignación familiar vigentes.</div>' +
    '<div class="card"><h2>Valores generales</h2><div class="grid grid-3">' +
    '<div class="field"><label>Valor UF ($)</label><input type="number" id="p-uf" value="' + p.uf + '" ' + (RO?'disabled':'') + '></div>' +
    '<div class="field"><label>Valor UTM ($)</label><input type="number" id="p-utm" value="' + p.utm + '" ' + (RO?'disabled':'') + '></div>' +
    '<div class="field"><label>Sueldo mínimo mensual ($)</label><input type="number" id="p-sm" value="' + p.sueldoMinimo + '" ' + (RO?'disabled':'') + '></div>' +
    '<div class="field"><label>Tope imponible (UF)</label><input type="number" step="0.1" id="p-tope" value="' + p.topeImponibleUF + '" ' + (RO?'disabled':'') + '></div>' +
    '<div class="field"><label>Salud legal (%)</label><input type="number" step="0.1" id="p-salud" value="' + p.saludPct + '" ' + (RO?'disabled':'') + '></div>' +
    '<div class="field"><label>Cesantía trabajador indef. (%)</label><input type="number" step="0.1" id="p-cestrab" value="' + p.cesantiaTrabajadorIndef + '" ' + (RO?'disabled':'') + '></div>' +
    '</div></div>' +
    '<div class="card"><h2>Tasas de cotización AFP (%)</h2><div class="grid grid-3">' + afpRows + '</div></div>' +
    '<div class="card"><h2>Tramos de asignación familiar</h2>' + asigRows + '</div>' +
    (RO ? '' : '<button class="btn gold" data-act="save-parametros">Guardar parámetros</button>');
}

/* ---- Acciones ---- */
function bindTabEvents(){
  document.querySelectorAll('[data-act]').forEach(function(btn){
    btn.onclick = function(){ handleAction(btn.dataset.act, btn.dataset.id); };
  });
}

var READONLY_SAFE = {'calc-liq':1,'print-liq':1,'ver-estudiante':1,'volver-lista':1};

async function handleAction(act, id){
  var RO = isReadOnly();
  if(RO && !READONLY_SAFE[act]){ toast('Estás en modo solo lectura (viendo el trabajo de un estudiante).'); return; }

  if(act==='new-estudiante'){
    openModal('Nuevo estudiante', estudianteForm(), async function(){
      var nombre = document.getElementById('f-est-nombre').value.trim();
      var codigo = document.getElementById('f-est-codigo').value.trim();
      if(!nombre){ toast('Indica el nombre del estudiante'); return false; }
      if(!codigo || codigo.length<4){ toast('El código debe tener al menos 4 caracteres'); return false; }
      if(codigo.toLowerCase()===(appData.profesorCodigo||'').toLowerCase() || appData.estudiantes.some(function(e){ return e.codigo.toLowerCase()===codigo.toLowerCase(); })){
        toast('Ese código ya está en uso, elige otro'); return false;
      }
      appData.estudiantes.push({ id: uid(), nombre: nombre, codigo: codigo, creadoEn: Date.now(), empresas: [], trabajadores: [], movimientos: {}, parametros: defaultParametros() });
      return await guardar('Estudiante creado. Código: ' + codigo);
    }, 'Crear estudiante');
    bindEstudianteFormRegen();
  }
  else if(act==='edit-estudiante'){
    var e0 = appData.estudiantes.find(function(x){ return x.id===id; });
    openModal('Editar estudiante', estudianteForm(e0), async function(){
      var nombre = document.getElementById('f-est-nombre').value.trim();
      var codigo = document.getElementById('f-est-codigo').value.trim();
      if(!nombre){ toast('Indica el nombre del estudiante'); return false; }
      if(!codigo || codigo.length<4){ toast('El código debe tener al menos 4 caracteres'); return false; }
      var dup = appData.estudiantes.some(function(x){ return x.id!==e0.id && x.codigo.toLowerCase()===codigo.toLowerCase(); });
      if(dup || codigo.toLowerCase()===(appData.profesorCodigo||'').toLowerCase()){ toast('Ese código ya está en uso, elige otro'); return false; }
      e0.nombre = nombre; e0.codigo = codigo;
      return await guardar('Estudiante actualizado');
    }, 'Guardar cambios');
    bindEstudianteFormRegen();
  }
  else if(act==='del-estudiante'){
    var eDel = appData.estudiantes.find(function(x){ return x.id===id; });
    if(!confirm('¿Eliminar a ' + (eDel?eDel.nombre:'este estudiante') + '? Se perderá todo su trabajo (empresas, trabajadores y liquidaciones).')) return;
    appData.estudiantes = appData.estudiantes.filter(function(x){ return x.id!==id; });
    await guardar('Estudiante eliminado');
  }
  else if(act==='ver-estudiante'){
    session.viewingId = id; saveSession(); ui.tab='empresas'; ui.empresaId=null; saveUi(); render();
  }
  else if(act==='volver-lista'){
    session.viewingId = null; saveSession(); ui.tab='estudiantes'; saveUi(); render();
  }
  else if(act==='save-profesor-codigo'){
    var val = document.getElementById('p-prof-codigo').value.trim();
    if(!val || val.length<4){ toast('El código debe tener al menos 4 caracteres'); return; }
    if(appData.estudiantes.some(function(e){ return e.codigo.toLowerCase()===val.toLowerCase(); })){ toast('Ese código ya lo usa un estudiante'); return; }
    appData.profesorCodigo = val;
    await guardar('Código de profesor actualizado');
  }
  else if(act==='new-empresa'){
    var AEne = activeEstudiante();
    openModal('Nueva empresa', empresaForm(), async function(){
      var razonSocial = document.getElementById('f-razonSocial').value.trim();
      if(!razonSocial){ toast('Indica la razón social'); return false; }
      AEne.empresas.push({ id: uid(), razonSocial: razonSocial, rut: document.getElementById('f-rut').value.trim(), giro: document.getElementById('f-giro').value.trim(), representante: document.getElementById('f-representante').value.trim(), direccion: document.getElementById('f-direccion').value.trim() });
      return await guardar('Empresa creada y guardada correctamente');
    });
  }
  else if(act==='edit-empresa'){
    var AEee = activeEstudiante();
    var emp = AEee.empresas.find(function(x){ return x.id===id; });
    openModal('Editar empresa', empresaForm(emp), async function(){
      emp.razonSocial = document.getElementById('f-razonSocial').value.trim();
      emp.rut = document.getElementById('f-rut').value.trim();
      emp.giro = document.getElementById('f-giro').value.trim();
      emp.representante = document.getElementById('f-representante').value.trim();
      emp.direccion = document.getElementById('f-direccion').value.trim();
      return await guardar('Empresa actualizada y guardada correctamente');
    });
  }
  else if(act==='del-empresa'){
    if(!confirm('¿Eliminar esta empresa? También se perderán sus trabajadores y movimientos.')) return;
    var AEde = activeEstudiante();
    AEde.empresas = AEde.empresas.filter(function(x){ return x.id!==id; });
    AEde.trabajadores = AEde.trabajadores.filter(function(x){ return x.empresaId!==id; });
    if(ui.empresaId===id) ui.empresaId = null;
    saveUi();
    await guardar('Empresa eliminada y cambios guardados');
  }
  else if(act==='new-trabajador'){
    var AEnt = activeEstudiante();
    openModal('Nuevo trabajador', trabajadorForm(null, AEnt), async function(){ return await saveTrabajadorFromForm(null, AEnt); }, 'Guardar trabajador');
  }
  else if(act==='edit-trabajador'){
    var AEet = activeEstudiante();
    var trab = AEet.trabajadores.find(function(x){ return x.id===id; });
    openModal('Editar trabajador', trabajadorForm(trab, AEet), async function(){ return await saveTrabajadorFromForm(trab, AEet); }, 'Guardar cambios');
  }
  else if(act==='del-trabajador'){
    if(!confirm('¿Eliminar a este trabajador de la nómina?')) return;
    var AEdt = activeEstudiante();
    AEdt.trabajadores = AEdt.trabajadores.filter(function(x){ return x.id!==id; });
    await guardar('Trabajador eliminado y cambios guardados');
  }
  else if(act==='save-parametros'){
    var AEp = activeEstudiante();
    var p = AEp.parametros;
    p.uf = Number(document.getElementById('p-uf').value)||p.uf;
    p.utm = Number(document.getElementById('p-utm').value)||p.utm;
    p.sueldoMinimo = Number(document.getElementById('p-sm').value)||p.sueldoMinimo;
    p.topeImponibleUF = Number(document.getElementById('p-tope').value)||p.topeImponibleUF;
    p.saludPct = Number(document.getElementById('p-salud').value)||p.saludPct;
    p.cesantiaTrabajadorIndef = Number(document.getElementById('p-cestrab').value)||p.cesantiaTrabajadorIndef;
    document.querySelectorAll('.afp-tasa').forEach(function(inp){ p.afp[inp.dataset.afp] = Number(inp.value)||0; });
    document.querySelectorAll('.asig-hasta').forEach(function(inp){ var i=Number(inp.dataset.i); p.asigFamiliar[i].hasta = inp.value===''? Infinity : Number(inp.value); });
    document.querySelectorAll('.asig-monto').forEach(function(inp){ var i=Number(inp.dataset.i); p.asigFamiliar[i].monto = Number(inp.value)||0; });
    await guardar('Parámetros guardados correctamente');
  }
}

async function saveTrabajadorFromForm(existing, AE){
  var nombres = document.getElementById('f-nombres').value.trim();
  var apellidos = document.getElementById('f-apellidos').value.trim();
  if(!nombres || !apellidos){ toast('Indica nombres y apellidos'); return false; }
  var data = {
    id: existing ? existing.id : uid(), empresaId: ui.empresaId, nombres: nombres, apellidos: apellidos,
    rut: document.getElementById('f-trut').value.trim(), cargo: document.getElementById('f-cargo').value.trim(),
    fechaIngreso: document.getElementById('f-fecha').value, tipoContrato: document.getElementById('f-tipoContrato').value,
    sueldoBase: Number(document.getElementById('f-sueldoBase').value)||0, afp: document.getElementById('f-afp').value,
    salud: document.getElementById('f-salud').value, montoIsapre: Number(document.getElementById('f-montoIsapre').value)||0,
    cargasFamiliares: Number(document.getElementById('f-cargas').value)||0, cuentaBanco: document.getElementById('f-cuenta').value.trim(),
    gratificacionLegal: document.getElementById('f-gratificacion').value !== 'no', activo: document.getElementById('f-activo').checked
  };
  if(existing){ Object.assign(existing, data); } else { AE.trabajadores.push(data); }
  return await guardar(existing ? 'Trabajador guardado correctamente' : 'Trabajador creado y guardado correctamente');
}

document.addEventListener('click', function(e){
  if(e.target.id==='gen-libro'){ generarLibro(); }
});

render();
</script>
</body>
</html>
